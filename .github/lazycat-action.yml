version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: risuai

build:
  run_buildscript: false
  toolchains: []

images:
  - id: risuai
    target: service
    service: risuai
    source: ghcr.io/kwaroran/risuai
    channel: custom
    sort: semver
    tag_regex: '^v\d+\.\d+\.\d+$'
    version_regex: '^v(?P<version>\d+\.\d+\.\d+)$'
    version_template: '{version}'
    delivery:
      mode: mirror
      image_template: ghcr.1ms.run/kwaroran/risuai:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: RisuAI
    summary: RisuAI for LazyCat
